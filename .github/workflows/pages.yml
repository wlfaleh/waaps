# Publie le jeu WaForSpeed sur GitHub Pages à chaque mise à jour de main,
# à l'adresse https://wlfaleh.github.io/waaps/waforspeed/
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Publier WaForSpeed sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'waforspeed/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # le jeu est publié dans le dossier waforspeed/ → https://wlfaleh.github.io/waaps/waforspeed/
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r waforspeed _site/waforspeed
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=waforspeed/"><title>WaForSpeed</title><a href="waforspeed/">WaForSpeed</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
