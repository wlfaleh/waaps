# Publie le jeu WaForSpeed sur GitHub Pages à chaque mise à jour de main.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Publier WaForSpeed sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'waforspeed/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: waforspeed
      - id: deployment
        uses: actions/deploy-pages@v4
